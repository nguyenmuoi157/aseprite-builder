name: Build and release Aseprite (macOS x86_64 + ARM64)

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  MACOS_MIN_VERSION: '12.0'
  SKIA_TAG: m124-08a5439a6b

jobs:
  fetch-aseprite-info:
    name: Fetch Aseprite release info
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
          group: aseprite
          repo: aseprite
          match: Aseprite-.*?-Source.zip

  create-release:
    name: Create GitHub Release
    needs: fetch-aseprite-info
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build macOS ${{ matrix.arch }}
    needs: [fetch-aseprite-info, create-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            skia_arch: x64
          - os: macos-15
            arch: arm64
            skia_arch: arm64

    steps:
      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "${{ matrix.arch }}"
          xcodebuild -version

      - name: Clone Aseprite source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail
          git clone --recurse-submodules -j8 \
            --branch "$RELEASE_TAG" \
            https://github.com/aseprite/aseprite.git

      - name: Download Skia
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output skia.zip \
            "https://github.com/aseprite/skia/releases/download/${SKIA_TAG}/Skia-macOS-Release-${{ matrix.skia_arch }}.zip"
          mkdir -p skia
          unzip -q skia.zip -d skia
          test -f "skia/out/Release-${{ matrix.skia_arch }}/libskia.a"
          rm skia.zip

      - name: Install Ninja
        shell: bash
        run: |
