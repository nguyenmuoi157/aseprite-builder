name: Build and release Aseprite (macOS x86_64 + ARM64)

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  MACOS_MIN_VERSION: '12.0'
  SKIA_TAG: m124-08a5439a6b

jobs:
  fetch-aseprite-info:
    name: Fetch Aseprite release info
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
          group: aseprite
          repo: aseprite
          match: Aseprite-.*?-Source.zip

  create-release:
    name: Create GitHub Release
    needs: fetch-aseprite-info
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build macOS ${{ matrix.arch }}
    needs: [fetch-aseprite-info, create-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            skia_arch: x64
          - os: macos-15
            arch: arm64
            skia_arch: arm64

    steps:
      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "${{ matrix.arch }}"
          xcodebuild -version

      - name: Clone Aseprite source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail
          git clone --recurse-submodules -j8 \
            --branch "$RELEASE_TAG" \
            https://github.com/aseprite/aseprite.git

      - name: Download Skia
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output skia.zip \
            "https://github.com/aseprite/skia/releases/download/${SKIA_TAG}/Skia-macOS-Release-${{ matrix.skia_arch }}.zip"
          mkdir -p skia
          unzip -q skia.zip -d skia
          test -f "skia/out/Release-${{ matrix.skia_arch }}/libskia.a"
          rm skia.zip

      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null; then
            brew install ninja
          fi
          ninja --version

      - name: Configure CMake
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail
          EXTRA_FLAGS=()
          if [ "${{ matrix.arch }}" = arm64 ]; then
            EXTRA_FLAGS+=("-DPNG_ARM_NEON:STRING=on")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-${{ matrix.skia_arch }})" \
            -DSKIA_LIBRARY="$(realpath skia/out/Release-${{ matrix.skia_arch }}/libskia.a)" \
            "${EXTRA_FLAGS[@]}"

      - name: Compile Aseprite
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail
          cmake --build build --parallel 3

      - name: Verify executable architecture
        shell: bash
        working-directory: aseprite/build/bin
        run: |
          set -euo pipefail
          file aseprite
          lipo -archs aseprite
          lipo -verify_arch "${{ matrix.arch }}" aseprite
          otool -l aseprite | grep -A4 LC_BUILD_VERSION || true

      - name: Create portable archive
        shell: bash
        working-directory: aseprite/build/bin
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aseprite-package"
          cp -R aseprite data "$RUNNER_TEMP/aseprite-package/"
          printf '%s\n' '# This file is here so Aseprite behaves as a portable program' \
            > "$RUNNER_TEMP/aseprite-package/aseprite.ini"
          cd "$RUNNER_TEMP/aseprite-package"
          zip -qry "$GITHUB_WORKSPACE/Aseprite-${RELEASE_TAG}-macOS-${{ matrix.arch }}.zip" .

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-macOS-${{ matrix.arch }}.zip
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-macOS-${{ matrix.arch }}.zip
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          overwrite: true
