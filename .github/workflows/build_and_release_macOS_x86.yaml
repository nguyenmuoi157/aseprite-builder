name: Build and release Aseprite (macOS x86_64 + ARM64)

on:
  push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
      - '.github/workflows/build_and_release_macOS_x86.yaml'
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  MACOS_MIN_VERSION: '12.0'
  SKIA_TAG: m124-08a5439a6b

jobs:
  fetch-aseprite-info:
    name: Fetch Aseprite release info
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:
      - name: Fetch Aseprite release
        id: aseprite-link
        uses: a1393323447/fetch-release@main
        with:
          group: aseprite
          repo: aseprite
          match: Aseprite-.*?-Source.zip

  create-release:
    name: Create GitHub Release
    needs: fetch-aseprite-info
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build macOS ${{ matrix.arch }}
    needs: [fetch-aseprite-info, create-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            skia_arch: x64
          - os: macos-15
            arch: arm64
            skia_arch: arm64

    steps:
      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "${{ matrix.arch }}"
          xcodebuild -version

      - name: Clone Aseprite source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail
          git clone --recurse-submodules -j8 \
            --branch "$RELEASE_TAG" \
            https://github.com/aseprite/aseprite.git

      - name: Download Skia
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output skia.zip \
            "https://github.com/aseprite/skia/releases/download/${SKIA_TAG}/Skia-macOS-Release-${{ matrix.skia_arch }}.zip"
          mkdir -p skia
          unzip -q skia.zip -d skia
          test -f "skia/out/Release-${{ matrix.skia_arch }}/libskia.a"
          rm skia.zip

      - name: Install Ninja
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null; then
            brew install ninja
          fi
          ninja --version

      - name: Configure CMake
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail
          PNG_ARM_NEON=off
          if [ "${{ matrix.arch }}" = arm64 ]; then
            PNG_ARM_NEON=on
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-${{ matrix.skia_arch }})" \
            -DSKIA_LIBRARY="$(realpath skia/out/Release-${{ matrix.skia_arch }}/libskia.a)" \
            -DPNG_ARM_NEON:STRING="$PNG_ARM_NEON"

      - name: Compile Aseprite
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail
          cmake --build build --target aseprite --parallel 3

      - name: Verify executable architecture
        shell: bash
        working-directory: aseprite/build/bin
        run: |
          set -euo pipefail
          file aseprite
          lipo -archs aseprite
          lipo aseprite -verify_arch "${{ matrix.arch }}"
          otool -l aseprite | grep -A4 LC_BUILD_VERSION || true

      - name: Package and verify macOS app
        shell: bash
        working-directory: aseprite/build/bin
        env:
          RELEASE_TAG: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/aseprite-package"
          VERIFY_DIR="$RUNNER_TEMP/aseprite-verify"
          ARCHIVE="$GITHUB_WORKSPACE/Aseprite-${RELEASE_TAG}-macOS-${{ matrix.arch }}.zip"
          mkdir -p "$PACKAGE_DIR" "$VERIFY_DIR"

          # bin/aseprite and bin/data are symlinks into the app bundle.
          # Copy the whole bundle so the download includes the real executable.
          test -d aseprite.app
          cp -R aseprite.app "$PACKAGE_DIR/Aseprite.app"
          APP="$PACKAGE_DIR/Aseprite.app"
          test -f "$APP/Contents/Info.plist"
          test -d "$APP/Contents/Resources/data"
          test ! -L "$APP/Contents/Resources/data"
          test -x "$APP/Contents/MacOS/aseprite"
          test ! -L "$APP/Contents/MacOS/aseprite"
          lipo "$APP/Contents/MacOS/aseprite" -verify_arch "${{ matrix.arch }}"

          cd "$PACKAGE_DIR"
          zip -qry "$ARCHIVE" Aseprite.app
          unzip -tq "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$VERIFY_DIR"
          EXTRACTED_APP="$VERIFY_DIR/Aseprite.app"
          test -f "$EXTRACTED_APP/Contents/Info.plist"
          test -d "$EXTRACTED_APP/Contents/Resources/data"
          test ! -L "$EXTRACTED_APP/Contents/Resources/data"
          test -x "$EXTRACTED_APP/Contents/MacOS/aseprite"
          test ! -L "$EXTRACTED_APP/Contents/MacOS/aseprite"
          cmp "$APP/Contents/MacOS/aseprite" "$EXTRACTED_APP/Contents/MacOS/aseprite"
          lipo "$EXTRACTED_APP/Contents/MacOS/aseprite" -verify_arch "${{ matrix.arch }}"
          "$EXTRACTED_APP/Contents/MacOS/aseprite" --batch --version
          ARCHIVE_BYTES="$(stat -f %z "$ARCHIVE")"
          test "$ARCHIVE_BYTES" -gt 1048576
          echo "Verified archive: $ARCHIVE_BYTES bytes"
          du -sh "$EXTRACTED_APP"

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-macOS-${{ matrix.arch }}.zip
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-macOS-${{ matrix.arch }}.zip
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          overwrite: true
